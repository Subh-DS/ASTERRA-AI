server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline hardening (no HSTS: this same config serves plain-HTTP local
  # previews; enable HSTS only on the HTTPS production host).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # All API traffic goes to the configured backend (VITE_API_URL is baked
  # in at build time, so the browser calls it directly — no proxy needed).
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
